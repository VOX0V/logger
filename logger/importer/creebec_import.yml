# Import profile "Air Creebec": one line per header of the file, written  header: entity  (entities: see Data > Entities).
# A header that is not listed here is not imported. The columns of the raw database are created by the import.
# Editable from Data > Import data > Edit import rules.
name: Air Creebec
columns:
  date: date_date
  type: aircraft_type
  reg: aircraft_registration
  pic: crew_pilot_name
  pic_name: crew_pilot_name
  dep: location_departure_code
  dep_time: location_departure_time_utc
  arr: location_arrival_code
  arr_time: location_arrival_time_utc
  flt_time: time_flight_hhmm
  pic_time: time_pic
  copi_time: time_copilot
  to_day: count_takeoff_day
  ldg_day: count_landing_day
  to_night: count_takeoff_night
  ldg_night: count_landing_night

# Headers of the file that are deliberately not imported.
ignored:
  - instr
  - sim_time
  - sim_type

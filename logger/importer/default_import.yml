# Import profile "Default": maps the headers of the file to RAW database columns (values are imported untouched).
# Format: see the top of app/import_profiles.py. Editable from Data > YML IMPORT.
name: Default
groups:
  - group: date
    columns:
      - {column: year, header: year}
      - {column: month, header: month}
      - {column: day, header: day}
      - {column: date, header: date}
  - group: aircrafts
    columns:
      - {column: type, header: type}
      - {column: registration, header: reg}
  - group: crew
    columns:
      - {column: pic_name, header: pic_name}
      - {column: copi_name, header: copi_name}
  - group: airports
    columns:
      - {column: dep_code, header: dep_code}
      - {column: arr_code, header: arr_code}
  - group: misc
    columns:
      - {column: remarks, header: remarks}
  - group: flight_time
    columns:
      - {column: se_dual_day, header: se_dual_day}
      - {column: se_pic_day, header: se_pic_day}
      - {column: se_dual_night, header: se_dual_night}
      - {column: se_pic_night, header: se_pic_night}
      - {column: me_dual_day, header: me_dual_day}
      - {column: me_pic_day, header: me_pic_day}
      - {column: me_copi_day, header: me_copi_day}
      - {column: me_dual_night, header: me_dual_night}
      - {column: me_pic_night, header: me_pic_night}
      - {column: me_copi_night, header: me_copi_night}
  - group: flight_details
    columns:
      - {column: ifr_time, header: ifr_time}
      - {column: hood_time, header: hood_time}
      - {column: ftd_time, header: ftd_time}
      - {column: ifr_app, header: ifr_app}
      - {column: cc_dual_day, header: cc_dual_day}
      - {column: cc_pic_day, header: cc_pic_day}
      - {column: cc_dual_night, header: cc_dual_night}
      - {column: cc_pic_night, header: cc_pic_night}
      - {column: landing_day, header: ldg_day, data_type: integer}
      - {column: landing_night, header: ldg_night, data_type: integer}
      - {column: instruction_day, header: instr_day}
      - {column: instruction_night, header: instr_night}

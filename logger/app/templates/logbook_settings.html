{% extends "base.html" %}
{% block content %}
<div class="page-head"><h2>Logbook settings</h2><div><a class="btn secondary" href="{{url_for('accounts.me')}}">Back to My account</a></div></div>
<form class="card" method="post" action="{{url_for('main.save_logbook_settings')}}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<h3>Presentation</h3><div class="grid"><div class="field"><label>Rows per table</label><input type="number" min="1" name="rows_per_page" value="{{layout.rows_per_page}}"></div><div class="field"><label>Row thickness (u)</label><input type="number" step="1" min="5" max="200" name="row_height_u" value="{{layout.row_height_u}}"></div><div class="field"><label>Police</label><input name="font_family" value="{{layout.styles.font_family}}"></div><div class="field"><label>Taille police</label><input type="number" name="font_size" value="{{layout.styles.font_size}}"></div><div class="field"><label>Header size</label><input type="number" name="header_font_size" value="{{layout.styles.header_font_size}}"></div><div class="field"><label>Header background</label><input type="text" name="header_background" value="{{layout.styles.header_background}}"></div><div class="field"><label>Totals background</label><input type="text" name="total_background" value="{{layout.styles.total_background}}"></div><div class="field"><label>Bordure</label><input type="text" name="border" value="{{layout.styles.border}}"></div><div class="field"><label>Alignement horizontal</label><select name="text_align"><option>left</option><option selected>center</option><option>right</option></select></div><div class="field"><label>Alignement vertical</label><select name="vertical_align"><option selected>middle</option><option>top</option><option>bottom</option></select></div></div>
<h3>Column widths</h3><table class="data"><thead><tr><th>Column</th><th>Group</th><th>DB</th><th>Width (u)</th><th>Actions</th></tr></thead><tbody>{% for c in layout.columns %}<tr><td>{{c.label}}</td><td>{{c.group}}</td><td>{{c.db_column or ''}}</td><td><input type="number" step="1" min="1" max="1100" name="width_{{c.key}}" value="{{c.width}}"></td><td><button class="btn danger" type="submit" form="delete-layout-{{c.key}}" data-confirm="Remove this column from the Logbook display?">Delete</button></td></tr>{% endfor %}</tbody></table>
<p><button class="btn">Save</button></p></form>
{% for c in layout.columns %}<form id="delete-layout-{{c.key}}" method="post" action="{{url_for('main.delete_layout_column',key=c.key)}}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"></form>{% endfor %}
<div class="card">{% endblock %}

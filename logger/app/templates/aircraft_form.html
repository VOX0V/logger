{% extends "base.html" %}{% block content %}
{% set v = form if form else aircraft %}
<h2>{{'Edit' if aircraft else 'New'}} aircraft type</h2>
<form class="card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="grid">
<div class="field"><label>Display (name shown in the logbook, e.g. DHC8)</label><input name="display" value="{{v.display if v and v.display is not none else ''}}"></div>
<div class="field"><label>Designator (e.g. DH1)</label><input name="designator" value="{{v.designator if v and v.designator is not none else ''}}" required></div>
<div class="field"><label>Maker</label><input name="maker" value="{{v.maker if v and v.maker is not none else ''}}"></div>
<div class="field"><label>Model</label><input name="model" value="{{v.model if v and v.model is not none else ''}}"></div>
{% for field, (title, pairs) in options.items() %}<div class="field"><label>{{title}}</label><select name="{{field}}"><option value="">-- not set --</option>{% for c, l in pairs %}<option value="{{c}}" {% if v and v[field]==c %}selected{% endif %}>{{l}}</option>{% endfor %}</select></div>
{% endfor %}<div class="field"><label>MTOW (lb)</label><input name="mtow_lb" value="{{v.mtow_lb if v and v.mtow_lb is not none else ''}}"></div>
<div class="field"><label>MTOW (kg)</label><input name="mtow_kg" value="{{v.mtow_kg if v and v.mtow_kg is not none else ''}}"></div>
</div><p><button class="btn">Save</button> <a class="btn secondary" href="{{url_for('converter.aircrafts')}}">Cancel</a></p></form>{% endblock %}

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logger</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f5f7;color:#20242a}header{background:#1f2937;color:#fff;padding:14px 24px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:20}header a{color:#fff;margin-left:14px;text-decoration:none}main{padding:10px 14px;max-width:none}.btn{display:inline-block;padding:8px 12px;background:#2563eb;color:white;text-decoration:none;border:0;border-radius:4px;cursor:pointer}.btn.secondary{background:#4b5563}.btn.danger{background:#b91c1c}.card{background:white;padding:20px;border:1px solid #ddd;border-radius:6px;margin-bottom:18px}.card.grid-card{padding:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{margin-bottom:12px}.field label{display:block;font-weight:600;font-size:12px;margin-bottom:4px}.field input,.field select,.field textarea{padding:8px;border:1px solid #bbb;border-radius:4px;width:100%;box-sizing:border-box}.rules{min-height:100px}.muted{color:#666}.flash{padding:10px 12px;background:#e8f5e9;margin-bottom:14px}.db-view{position:relative}.db-scrollbar{position:sticky;top:59px;z-index:15;overflow-x:auto;overflow-y:hidden;height:18px;background:#f4f5f7;margin-bottom:2px}.db-scrollbar-inner{height:1px}.db-table-wrap{max-height:calc(100vh - 170px);overflow:auto;background:white}.data-table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0;background:white}.data-table th,.data-table td{border-right:1px solid #ddd;border-bottom:1px solid #ddd;padding:7px;text-align:left;vertical-align:top}.data-table th{background:#eef1f4;position:sticky;top:0;z-index:10;white-space:nowrap}.data-table td{white-space:nowrap}.data{border-collapse:collapse;width:max-content;min-width:100%;background:#fff}.data th,.data td{border:1px solid #ddd;padding:7px;text-align:left}.app-version{position:fixed;right:8px;bottom:4px;font-size:10px;color:#777;z-index:30}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>

<style>
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.inline{display:inline}.logbook-card{padding:10px}.logbook-meta{display:flex;justify-content:space-between;margin:0 0 8px;font-size:12px;color:#555}.logbook-scroll{overflow:auto;border:1px solid #000;background:#fff}.logbook-table{border-collapse:collapse;table-layout:fixed;min-width:max-content;background:#fff}.logbook-table th,.logbook-table td{border:var(--border);padding:2px 4px;height:var(--row-h);box-sizing:border-box;white-space:nowrap;overflow:hidden}.logbook-table th{text-align:var(--text-align);vertical-align:var(--vertical-align);background:var(--header-bg);font-weight:700}.logbook-table .h1 th{height:var(--h1,16.95px);font-size:var(--header-size,9px)}.logbook-table .h2 th{height:var(--h2,16.95px);font-size:var(--header-size,9px)}.logbook-table .h3 th{height:var(--h3,16.95px);font-size:var(--header-size,9px)}.logbook-table td{text-align:center;vertical-align:middle}.logbook-table td.spacer{background:#fff}.logbook-table .cell-input{width:100%;height:100%;border:0;background:transparent;padding:0;margin:0;text-align:center;font:inherit;box-sizing:border-box;outline:none}.logbook-table .cell-input:focus{background:#eef5ff;outline:1px solid #2563eb}.logbook-table .page-total td,.logbook-table .grand-total td{font-weight:700;background:var(--total-bg)}.pagination{display:flex;justify-content:center;gap:8px;margin:12px 0}.logbook-table .total-cell{font-weight:600}.data input[type=number]{width:90px}.data{border-collapse:collapse;width:100%;background:#fff}.data th,.data td{border:1px solid #ddd;padding:7px;text-align:left}
</style>

<style>
.tabulator{border:1px solid #ddd;border-radius:6px;background:#fff;font-family:system-ui,sans-serif;font-size:13px;overflow:hidden}
.tabulator .tabulator-header{background:#eef1f4;border-bottom:1px solid #ddd;color:#20242a}
.tabulator .tabulator-col{border-right:1px solid #e2e5e9;background:#eef1f4}
.tabulator .tabulator-col .tabulator-col-content{padding:7px 8px}
.tabulator .tabulator-col-title{font-weight:600;font-size:12px}
.tabulator .tabulator-col-group .tabulator-col-group-cols{border-top:1px solid #ddd}
.tabulator-row{background:#fff;border-bottom:1px solid #eef0f2}
.tabulator-row.tabulator-row-even{background:#f9fafb}
.tabulator-row:hover{background:#eef5ff}
.tabulator-row .tabulator-cell{padding:6px 8px;border-right:1px solid #eef0f2}
.tabulator-row .tabulator-cell.tabulator-editing{border:1px solid #2563eb;box-shadow:inset 0 0 0 1px #2563eb}
.tabulator-row .tabulator-cell.tabulator-editing input{font:inherit;text-align:inherit}
.tabulator .tabulator-footer{background:#f4f5f7;border-top:1px solid #ddd;color:#555;padding:6px 10px}
.tabulator .tabulator-footer .tabulator-page{border:1px solid #ddd;background:#fff;border-radius:4px;padding:3px 9px;margin:0 2px;color:#20242a}
.tabulator .tabulator-footer .tabulator-page.active{background:#2563eb;border-color:#2563eb;color:#fff}
.tabulator .tabulator-footer .tabulator-page:disabled{opacity:.4}
.tabulator .tabulator-calcs-holder{background:#eef1f4;border-top:2px solid #ddd;font-weight:700}
.tabulator .tabulator-calcs-holder .tabulator-cell{background:transparent}
.tabulator .tabulator-header-filter input{border:1px solid #ccc;border-radius:3px;padding:3px 5px;font-size:12px}
.tabulator .tabulator-frozen{box-shadow:2px 0 4px rgba(0,0,0,.08)}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}
.pager button:disabled{opacity:.4;cursor:default}
.year-tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid #ddd}
.year-tab{padding:8px 16px;border:1px solid #ddd;border-bottom:0;background:#eef1f4;border-radius:6px 6px 0 0;cursor:pointer;font-weight:600;color:#555}
a.year-tab{display:inline-block;text-decoration:none}
.year-tab.active{background:#fff;color:#2563eb;border-color:#2563eb}
.year-panel.hidden{display:none}
header a.header-btn{margin-left:16px;padding:5px 14px;border-radius:5px;background:#2563eb;font-weight:600;font-size:13px}
header a.header-btn:hover{background:#1d4ed8}
.tabulator-row.totals-row{font-weight:700;background:#eef1f4;border-top:2px solid #ddd}
.tabulator-row.totals-row.totals-to_date{background:#e3ecff}
</style>
</head>
<body>
<header><div style="display:flex;align-items:center"><strong>Logger</strong><span style="font-size:11px;margin-left:8px;color:#9ca3af">v{{config.APP_VERSION}}</span>{% if g.user %}<a class="header-btn" href="{{url_for('main.logbook')}}">Logbook</a>{% endif %}</div><nav>{% if g.user %}<a href="{{url_for('accounts.me')}}">{{g.username}}{% if g.role=='admin' %} (admin){% endif %}</a><a href="{{url_for('auth.logout')}}">Logout</a>{% endif %}</nav></header>
<main>{% for message in get_flashed_messages() %}<div class="flash">{{message}}</div>{% endfor %}{% block content %}{% endblock %}</main>
</body></html>

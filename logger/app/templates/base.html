<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Database</title><style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f5f7;color:#20242a}header{background:#1f2937;color:#fff;padding:14px 24px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:20}header a{color:#fff;text-decoration:none}main{padding:24px;max-width:1800px;margin:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.nav-links{display:flex;gap:16px;align-items:center}.btn{display:inline-block;padding:8px 12px;background:#2563eb;color:#fff;text-decoration:none;border:0;border-radius:4px;cursor:pointer}.btn.secondary{background:#4b5563}.btn.danger{background:#b91c1c}.card{background:#fff;padding:20px;border:1px solid #ddd;border-radius:6px;margin-bottom:18px}.field{margin-bottom:15px}.field label{display:block;font-size:13px}.field input,.field select,.field textarea{margin-top:5px;padding:8px;border:1px solid #bbb;border-radius:4px;width:100%;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.error{color:#b91c1c;background:#fee2e2;padding:10px;border-radius:4px}.flash{padding:10px 12px;background:#e8f5e9;margin-bottom:14px}.data-wrap{overflow:auto;background:#fff;border:1px solid #ddd}.data-table{border-collapse:collapse;min-width:100%;width:max-content}.data-table th,.data-table td{border:1px solid #ddd;padding:7px 9px;white-space:nowrap;text-align:left}.data-table th{background:#eef1f4;position:sticky;top:0}.actions{white-space:nowrap}.actions a{margin-right:8px}.muted{color:#666;font-size:13px}.app-version{position:fixed;right:8px;bottom:5px;font-size:10px;color:#777}@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style></head><body><header><strong>User Database</strong><nav class="nav-links">{% if session.user %}<a href="{{url_for('main.index')}}">Données</a><a href="{{url_for('admin.settings')}}">Settings</a><span>{{session.user}}</span><a href="{{url_for('auth.logout')}}">Logout</a>{% endif %}</nav></header><main>{% with messages=get_flashed_messages() %}{% for message in messages %}<div class="flash">{{message}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><span class="app-version">v{{config.APP_VERSION}}</span></body></html>

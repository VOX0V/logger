<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logger</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f5f7;color:#222}header{background:#1f2937;color:#fff;padding:14px 24px;display:flex;justify-content:space-between}header a{color:#fff;margin-left:14px;text-decoration:none}main{max-width:1500px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd;border-radius:6px;padding:20px;margin-bottom:18px}.btn{display:inline-block;background:#2563eb;color:#fff;border:0;border-radius:4px;padding:8px 12px;text-decoration:none;cursor:pointer}.danger{background:#b91c1c}.secondary{background:#4b5563}.flash{background:#e8f5e9;padding:10px;margin-bottom:10px}.table-wrap{overflow:auto}.data{border-collapse:collapse;width:100%;background:#fff}.data th,.data td{border:1px solid #ddd;padding:7px;text-align:left}.data th{background:#eef1f4}.field{margin-bottom:12px}.field label{display:block;font-weight:600;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid #bbb;border-radius:4px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.rules{min-height:100px}.muted{color:#666}.app-version{position:fixed;right:8px;bottom:4px;font-size:10px;color:#777}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><header><strong>Logger</strong><nav>{% if session.user %}<a href="{{url_for('main.index')}}">Users</a><a href="{{url_for('main.import_files')}}">Importer</a><a href="{{url_for('main.settings')}}">Settings</a><a href="{{url_for('auth.logout')}}">Logout</a>{% endif %}</nav></header><main>{% for message in get_flashed_messages() %}<div class="flash">{{message}}</div>{% endfor %}{% block content %}{% endblock %}</main><span class="app-version">v{{config.APP_VERSION}}</span></body></html>

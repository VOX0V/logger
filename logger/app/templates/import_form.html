{% extends "base.html" %}{% block content %}<div class="card"><h2>Import into user.db</h2>{% if error %}<p class="error">{{error}}</p>{% endif %}<p class="muted">Select several Excel files. A single button starts the import according to the rules configured in Settings.</p><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label>Excel files<input type="file" name="files" accept=".xlsx,.xlsm" multiple required></label></div><button class="btn" type="submit">IMPORT</button></form></div>{% endblock %}

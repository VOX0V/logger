{% extends "base.html" %}{% block content %}<h2>{{'Modifier' if category else 'Nouvelle'}} colonne logbook</h2><form class="card" method="post"><div class="grid"><div class="field"><label>Display name</label><input name="display_name" value="{{category.display_name if category else ''}}" required></div><div class="field"><label>Groupe</label><select name="group"><option value="">-- choisir --</option>{% for g in groups %}<option value="{{g}}" {% if category and category.group==g %}selected{% endif %}>{{g}}</option>{% endfor %}<option value="__new__">Nouveau groupe</option></select></div><div class="field"><label>Position</label><select name="position">{% for p in positions %}<option value="{{p}}" {% if category and category.position==p or not category and p==positions|length %}selected{% endif %}>{{p}}</option>{% endfor %}</select></div><div class="field"><label>Data type</label><select name="data_type">{% for t in ['text','integer','decimal','date','datetime','boolean'] %}<option value="{{t}}" {% if category and category.data_type==t or not category and t=='text' %}selected{% endif %}>{{t}}</option>{% endfor %}</select></div><div class="field"><label>Nom technique</label><input value="{{category.column if category else 'généré automatiquement'}}" disabled></div></div><div class="field"><label>Groupe nouveau</label><input name="new_group" placeholder="Utilisé si Nouveau groupe est sélectionné"></div><div><label><input type="checkbox" name="nullable" value="1" {% if not category or category.nullable %}checked{% endif %}> Nullable</label> <label><input type="checkbox" name="visible" value="1" {% if not category or category.visible %}checked{% endif %}> Visible</label> <label><input type="checkbox" name="editable" value="1" {% if not category or category.editable %}checked{% endif %}> Editable</label></div><p><button class="btn">Enregistrer</button> <a class="btn secondary" href="{{url_for('main.logbook_settings')}}">Annuler</a></p></form>{% endblock %}

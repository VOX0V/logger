{% extends "base.html" %}{% block content %}
<div class="page-head"><h2>Raw data</h2><div class="btns"><button type="button" class="btn secondary" data-toggle="add-panel">Add row</button><button type="button" class="btn danger" id="grid-delete">Delete selected</button><a class="btn secondary" href="{{url_for('hubs.data')}}">Data</a></div></div>
{% include "_grid_add.html" %}
<div class="card grid-card"><div id="grid"></div></div>
<link href="{{ url_for('static', filename='vendor/tabulator/tabulator.min.css') }}" rel="stylesheet">
<script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='vendor/tabulator/tabulator.min.js') }}"></script>
<script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='grid.js') }}"></script>
<script nonce="{{ csp_nonce }}">
const view = {{view|tojson}};
initGrid({rowsUrl: "{{url_for('main.data_rows')}}", cellUrl: "{{url_for('main.edit_data_cell')}}", addUrl: "{{url_for('main.add_data_row')}}", deleteUrl: "{{url_for('main.delete_data_rows')}}",
  columns: view.map(c => ({field: c.column, title: c.label, width: c.width, hozAlign: c.align, frozen: c.frozen,
    sorter: (c.data_type === "integer" || c.data_type === "decimal") ? "number" : "string"}))});
</script>
{% endblock %}

{% extends "base.html" %}{% block content %}<div class="card"><h2>Confirmer ton mot de passe</h2><p class="muted">Cette action est sensible : confirme ton identité (valable quelques minutes).</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="next" value="{{ next }}"><div class="field"><label>Mot de passe</label><input type="password" name="password" required autocomplete="current-password" autofocus></div>{% if error %}<p>{{error}}</p>{% endif %}<button class="btn">Confirmer</button></form></div>{% endblock %}

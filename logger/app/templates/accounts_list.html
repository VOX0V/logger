{% extends "base.html" %}{% block content %}<div style="display:flex;justify-content:space-between;align-items:center"><h2>Comptes</h2><a class="btn" href="{{url_for('accounts.new_account')}}">Nouveau compte</a></div><div class="card"><div class="table-wrap"><table class="data"><thead><tr><th>Username</th><th>Rôle</th><th>Créé le</th><th>Actions</th></tr></thead><tbody>{% for a in accounts %}<tr><td>{{a.username}}</td><td>{{a.role}}</td><td>{{a.created_at}}</td><td><a class="btn secondary" href="{{url_for('accounts.edit_account',account_id=a.id)}}">Modifier</a> <form style="display:inline" method="post" action="{{url_for('accounts.delete_account_route',account_id=a.id)}}" onsubmit="return confirm('Supprimer ce compte ? (les données de l\'utilisateur ne sont pas effacées)')"><button class="btn danger" type="submit">Supprimer</button></form></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}

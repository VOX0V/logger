{% extends "base.html" %}{% block content %}<h2>{% if account %}Modifier le compte{% else %}Nouveau compte{% endif %}</h2><div class="card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="grid">
<div class="field"><label>Username</label>{% if account %}<input value="{{account.username}}" readonly>{% else %}<input name="username" required pattern="[A-Za-z0-9_-]{3,32}" title="3 à 32 caractères : lettres, chiffres, _ ou -">{% endif %}</div>
<div class="field"><label>{% if account %}Nouveau mot de passe{% else %}Mot de passe{% endif %}</label><input type="password" name="password" {% if not account %}required{% endif %} autocomplete="new-password" placeholder="{% if account %}laisser vide pour ne pas changer{% else %}15 caractères minimum{% endif %}"></div>
<div class="field"><label>Rôle</label><select name="role"><option value="user" {% if account and account.role=='user' %}selected{% endif %}>user</option><option value="admin" {% if account and account.role=='admin' %}selected{% endif %}>admin</option></select></div>
{% if account %}<div class="field"><label>État</label><label><input type="checkbox" name="active" value="1" {% if account.active %}checked{% endif %}> Compte actif</label></div>{% endif %}
</div><button class="btn">Enregistrer</button> <a class="btn secondary" href="{{url_for('accounts.list_view')}}">Annuler</a></form>{% if account %}<form method="post" action="{{url_for('accounts.revoke_account_sessions',account_id=account.id)}}" style="margin-top:12px"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn secondary" data-confirm="Déconnecter toutes les sessions de ce compte ?">Déconnecter toutes ses sessions</button></form>{% endif %}</div>{% endblock %}

{% extends "base.html" %}{% block content %}<h2>{% if account %}Edit account{% else %}New account{% endif %}</h2><div class="card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="grid">
<div class="field"><label>Username</label>{% if account %}<input value="{{account.username}}" readonly>{% else %}<input name="username" required pattern="[A-Za-z0-9_-]{3,32}" title="3 to 32 characters: letters, digits, _ or -">{% endif %}</div>
<div class="field"><label>{% if account %}New password{% else %}Password{% endif %}</label><input type="password" name="password" {% if not account %}required{% endif %} autocomplete="new-password" placeholder="{% if account %}leave empty to keep unchanged{% else %}At least 15 characters{% endif %}"></div>
<div class="field"><label>Role</label><select name="role"><option value="user" {% if account and account.role=='user' %}selected{% endif %}>user</option><option value="admin" {% if account and account.role=='admin' %}selected{% endif %}>admin</option></select></div>
{% if account %}<div class="field"><label>Status</label><label><input type="checkbox" name="active" value="1" {% if account.active %}checked{% endif %}> Active account</label></div>{% endif %}
</div><button class="btn">Save</button> <a class="btn secondary" href="{{url_for('accounts.list_view')}}">Cancel</a></form>{% if account %}<form method="post" action="{{url_for('accounts.revoke_account_sessions',account_id=account.id)}}" style="margin-top:12px"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn secondary" data-confirm="Sign out all sessions of this account?">Sign out all its sessions</button></form>{% endif %}</div>{% endblock %}

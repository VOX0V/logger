{% extends "base.html" %}{% block content %}<h2>{% if category %}Modifier la colonne{% else %}Nouvelle colonne{% endif %}</h2><div class="card"><form method="post" action="{{action}}"><div class="grid"><div class="field"><label>Display name</label><input name="display_name" id="display_name" value="{{category.display_name if category else ''}}" required><small class="muted">Le nom technique est généré automatiquement.</small></div><div class="field"><label>Group</label><select name="group" id="group" required><option value="">-- sélectionner --</option>{% for g in groups %}<option value="{{g}}"{% if category and category.group == g %} selected{% endif %}>{{g}}</option>{% endfor %}<option value="__new__">+ Nouveau groupe</option></select></div><div class="field"><label>Position</label><select name="position">{% for p in positions %}<option value="{{p}}"{% if p == next_position %} selected{% endif %}>{{p}}</option>{% endfor %}</select></div><div class="field"><label>Data type</label><select name="data_type"><option value="text"{% if not category or category.data_type == 'text' %} selected{% endif %}>text</option><option value="integer"{% if category and category.data_type == 'integer' %} selected{% endif %}>integer</option><option value="decimal"{% if category and category.data_type == 'decimal' %} selected{% endif %}>decimal</option><option value="date"{% if category and category.data_type == 'date' %} selected{% endif %}>date</option><option value="datetime"{% if category and category.data_type == 'datetime' %} selected{% endif %}>datetime</option><option value="boolean"{% if category and category.data_type == 'boolean' %} selected{% endif %}>boolean</option></select></div></div><div class="field" id="new-group-field" style="display:none"><label>New group</label><input name="new_group"></div><div class="field"><label>Column</label><input id="column_preview" value="{{category.column if category else ''}}" readonly></div><div class="grid"><label><input type="checkbox" name="nullable" value="1"{% if not category or category.nullable %} checked{% endif %}> Nullable</label><label><input type="checkbox" name="visible" value="1"{% if not category or category.visible %} checked{% endif %}> Visible</label><label><input type="checkbox" name="editable" value="1"{% if not category or category.editable %} checked{% endif %}> Editable</label></div><div class="field"><label>Import rules</label><textarea class="rules" name="import_rules" placeholder="Une règle par ligne. Elles sont alternatives (OR)." required>{% if category %}{{category.import_rules|join('\n')}}{% endif %}</textarea></div><button class="btn">Enregistrer</button> <a class="btn secondary" href="{{url_for('main.settings')}}">Annuler</a></form></div><script>const g=document.getElementById('group'),n=document.getElementById('new-group-field'),a=document.getElementById('display_name'),p=document.getElementById('column_preview');function ug(){n.style.display=g.value==='__new__'?'block':'none'}function ut(){let v=a.value.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/_+/g,'_').replace(/^_+|_+$/g,'');if(/^\d/.test(v))v='_'+v;p.value=v}g.addEventListener('change',ug);a.addEventListener('input',ut);ug();ut();</script>{% endblock %}

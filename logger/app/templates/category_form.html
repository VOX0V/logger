{% extends "base.html" %}{% block content %}<h2>Nouvelle catégorie</h2><div class="card"><form method="post"><div class="grid"><div class="field"><label>Affichage</label><input name="affichage" required></div><div class="field"><label>Groupe</label><select name="groupe" id="groupe" required><option value="">-- sélectionner --</option>{% for g in groups %}<option value="{{g}}">{{g}}</option>{% endfor %}<option value="__new__">+ Nouveau groupe</option></select></div><div class="field"><label>Position</label><select name="position">{% for p in positions %}<option value="{{p}}"{% if p == next_position %} selected{% endif %}>{{p}}</option>{% endfor %}</select></div></div><div class="field" id="new-group-field" style="display:none"><label>Nouveau groupe</label><input name="nouveau_groupe"></div><div class="field"><label>Colonne technique</label><input name="colonne_technique" placeholder="ex: registration" required></div><div class="field"><label>Règles d'import</label><textarea class="rules" name="import_rules" placeholder="Une règle par ligne. Elles sont alternatives (OR)." required></textarea></div><button class="btn">Enregistrer</button> <a class="btn secondary" href="{{url_for('main.settings')}}">Annuler</a></form></div><script>const s=document.getElementById('groupe'),n=document.getElementById('new-group-field');s.addEventListener('change',()=>n.style.display=s.value==='__new__'?'block':'none');</script>{% endblock %}

{% extends "base.html" %}{% block content %}<div class="card"><h2>{{'Modifier la catégorie' if category else 'Nouvelle catégorie'}}</h2>{% if error %}<p class="error">{{error}}</p>{% endif %}<form method="post"><div class="grid"><div class="field"><label>Affichage<input name="display_name" value="{{display_name}}" required></label></div><div class="field"><label>Position<select name="position">{% for n in range(1,max_position+1) %}<option value="{{n}}" {% if n==position %}selected{% endif %}>{{n}}</option>{% endfor %}</select></label></div><div class="field"><label>Groupe<input name="group_name" value="{{group_name}}"></label></div></div><div class="field"><label>Règles d'import — une règle par ligne, évaluées en OU<textarea name="rules" rows="7" placeholder="immat&#10;reg&#10;registration">{{rules_text}}</textarea></label></div>{% if category %}<p class="muted">Colonne technique : <code>{{category.column_name}}</code></p>{% endif %}<button class="btn" type="submit">Enregistrer</button> <a href="{{url_for('admin.settings')}}">Annuler</a></form></div>{% endblock %}

{% extends "base.html" %}{% block content %}<h2>{% if category %}Modifier la catégorie{% else %}Nouvelle catégorie{% endif %}</h2><div class="card"><form method="post" action="{{action}}"><div class="grid"><div class="field"><label>Affichage</label><input name="affichage" id="affichage" value="{{category.affichage if category else ''}}" required><small class="muted">La colonne technique est générée automatiquement.</small></div><div class="field"><label>Groupe</label><select name="groupe" id="groupe" required><option value="">-- sélectionner --</option>{% for g in groups %}<option value="{{g}}"{% if category and category.groupe == g %} selected{% endif %}>{{g}}</option>{% endfor %}<option value="__new__">+ Nouveau groupe</option></select></div><div class="field"><label>Position</label><select name="position">{% for p in positions %}<option value="{{p}}"{% if p == next_position %} selected{% endif %}>{{p}}</option>{% endfor %}</select></div></div><div class="field" id="new-group-field" style="display:none"><label>Nouveau groupe</label><input name="nouveau_groupe"></div><div class="field"><label>Colonne technique générée</label><input id="colonne_technique_preview" value="{{category.colonne_technique if category else ''}}" readonly></div><div class="field"><label>Règles d'import</label><textarea class="rules" name="import_rules" placeholder="Une règle par ligne. Elles sont alternatives (OR)." required>{% if category %}{{category['import']|join('\n')}}{% endif %}</textarea></div><button class="btn">Enregistrer</button> <a class="btn secondary" href="{{url_for('main.settings')}}">Annuler</a></form></div><script>const s=document.getElementById('groupe'),n=document.getElementById('new-group-field'),a=document.getElementById('affichage'),p=document.getElementById('colonne_technique_preview');function updateGroup(){n.style.display=s.value==='__new__'?'block':'none'}function updateTechnique(){let v=a.value.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/_+/g,'_').replace(/^_+|_+$/g,'');if(/^\d/.test(v))v='_'+v;p.value=v}s.addEventListener('change',updateGroup);a.addEventListener('input',updateTechnique);updateGroup();updateTechnique();</script>{% endblock %}

{% extends "base.html" %}{% block content %}
<div class="page-head"><h2>Logbook</h2><div><a class="btn secondary" href="{{url_for('main.logbook_settings')}}">Settings</a></div></div>
<div class="year-tabs">{% for y in years %}<button class="year-tab{% if loop.first %} active{% endif %}" data-year="{{y}}">{{y}}</button>{% endfor %}</div>
{% for y in years %}
<div class="year-panel{% if not loop.first %} hidden{% endif %}" data-year-panel="{{y}}">
{% for page in year_pages[y] %}<div class="card grid-card"><div id="grid-{{y}}-{{loop.index0}}" data-page="{{loop.index0}}"></div></div>{% endfor %}
</div>
{% else %}<div class="card"><p class="muted">Aucune donnée. Actualise depuis Données converties.</p></div>
{% endfor %}
<link href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.0/dist/css/tabulator.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
<script>
const layoutColumns = {{columns|tojson}};
const yearPages = {{year_pages|tojson}};
const yearSummaries = {{year_summaries|tojson}};
const groupLabels = {{layout.group_labels|tojson}};

function columnDef(c){
  const def = {field: c.key, title: c.label, width: Math.max(55, Math.round((c.width||13)*7)),
    hozAlign: c.numeric ? "right" : "center", headerSort: false};
  if (c.numeric) {
    def.formatter = (cell) => { const v = cell.getValue(); return (v === "" || v === null || v === undefined) ? "" : Number(v).toFixed(1); };
  }
  if (c.editable) {
    def.editor = "input";
    def.editable = (cell) => !cell.getRow().getData()._kind;
    def.cellEdited = function(cell){
      const data = new URLSearchParams({row_id: cell.getRow().getData().id, column: c.db_column, value: cell.getValue() ?? ""});
      fetch("{{url_for('main.edit_logbook_cell')}}", {method:"POST", body:data}).then(r=>{
        if(!r.ok) throw new Error();
      }).catch(()=>{ alert("Échec de l'enregistrement — réessaie."); cell.restoreOldValue(); });
    };
  }
  return def;
}

function buildColumns(cols){
  const out = []; let i = 0;
  while (i < cols.length) {
    const group = cols[i].group; let j = i + 1;
    while (j < cols.length && cols[j].group === group) j++;
    const slice = cols.slice(i, j);
    const hasSub = slice.some(c => c.subgroup);
    if (hasSub) {
      const subOut = []; let k = 0;
      while (k < slice.length) {
        const sub = slice[k].subgroup || "";
        let m = k + 1;
        while (m < slice.length && (slice[m].subgroup || "") === sub) m++;
        subOut.push({title: sub, columns: slice.slice(k, m).map(columnDef)});
        k = m;
      }
      out.push({title: groupLabels[group] || group, columns: subOut});
    } else {
      out.push({title: groupLabels[group] || group, columns: slice.map(columnDef)});
    }
    i = j;
  }
  return out;
}

const tableColumns = buildColumns(layoutColumns);
for (const year in yearPages) {
  yearPages[year].forEach((pageRows, i) => {
    const summary = (yearSummaries[year] && yearSummaries[year][i]) || [];
    new Tabulator(`#grid-${year}-${i}`, {
      data: pageRows.concat(summary), columns: tableColumns, layout: "fitDataFill",
      columnDefaults: {resizable: true},
      rowFormatter: function(row){
        const data = row.getData();
        if (data._kind) { row.getElement().classList.add("totals-row", "totals-" + data._kind); return; }
        const pos = row.getPosition();
        const bands = ["#F2DCDB", "#DCE6F2", "#EBF1DE"];
        row.getElement().style.background = (pos % 2 === 1) ? bands[Math.floor((pos - 1) / 10) % 3] : "#fff";
      }
    });
  });
}

document.querySelectorAll(".year-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".year-tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".year-panel").forEach(p => p.classList.add("hidden"));
    tab.classList.add("active");
    document.querySelector(`.year-panel[data-year-panel="${tab.dataset.year}"]`).classList.remove("hidden");
  });
});
</script>
{% endblock %}

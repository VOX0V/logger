{% extends "base.html" %}
{% block content %}
<div class="page-head"><h2>Converter settings</h2><div><a class="btn secondary" href="{{url_for('accounts.me')}}">Back to My account</a></div></div>
<div class="card"><h3>Converter settings</h3><form method="post" action="{{url_for('converter.save_settings_route')}}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="grid">
<div class="field"><label>Night: minutes after sunset</label><input type="number" name="after_sunset_minutes" min="0" max="180" value="{{settings.night.after_sunset_minutes}}"></div>
<div class="field"><label>Night: minutes before sunrise</label><input type="number" name="before_sunrise_minutes" min="0" max="180" value="{{settings.night.before_sunrise_minutes}}"></div>
</div><div class="field"><label>Transport Canada rounding — one range per line: min-max=decimal (add +1h to count one more hour)</label><textarea class="rules" name="tc_rounding">{{rounding_text}}</textarea></div>
<p><button class="btn">Save settings</button></p></form></div>
{% endblock %}

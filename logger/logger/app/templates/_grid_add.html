<style>[hidden]{display:none!important}.add-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;max-height:50vh;overflow:auto;margin-bottom:12px}.page-head .btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}</style>
<div class="card" id="add-panel" hidden><form id="grid-add" autocomplete="off"><div class="add-grid">{% for f in add_fields %}<div class="field"><label>{{f.label}}</label>{% if f.options %}<select name="{{f.name}}"><option value=""></option>{% for v, l in f.options %}<option value="{{v}}">{{l}}</option>{% endfor %}</select>{% else %}<input name="{{f.name}}"{% if f.kind %} type="{{f.kind}}"{% endif %}>{% endif %}</div>{% endfor %}</div><button class="btn">Add</button></form></div>

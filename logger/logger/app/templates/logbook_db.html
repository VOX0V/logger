{% extends "base.html" %}{% block content %}
<div class="page-head"><h2>Work data</h2><div class="btns"><button type="button" class="btn secondary" data-toggle="add-panel">Add row</button><button type="button" class="btn danger" id="grid-delete">Delete selected</button><form class="inline" method="post" action="{{url_for('main.refresh_logbook_data')}}" data-confirm="Refresh rebuilds the work data from the raw data and erases the changes made by hand here. Continue?"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn">Refresh</button></form><a class="btn secondary" href="{{url_for('hubs.data')}}">Data</a></div></div>
{% include "_grid_add.html" %}
<div class="card grid-card"><div id="grid"></div></div>
<link href="{{ url_for('static', filename='vendor/tabulator/tabulator.min.css') }}" rel="stylesheet">
<script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='vendor/tabulator/tabulator.min.js') }}"></script>
<script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='grid.js') }}"></script>
<script nonce="{{ csp_nonce }}">
const view = {{view|tojson}};
initGrid({rowsUrl: "{{url_for('main.logbook_db_rows')}}", cellUrl: "{{url_for('main.edit_logbook_cell')}}", addUrl: "{{url_for('main.add_logbook_row')}}", deleteUrl: "{{url_for('main.delete_logbook_rows')}}",
  placeholder: "No data. Click Refresh.",
  columns: view.map(c => ({field: c.column, title: c.label, width: c.width, hozAlign: c.align, frozen: c.frozen,
    sorter: (c.data_type === "integer" || c.data_type === "decimal") ? "number" : "string",
    formatter: (c.column === "month" || c.column === "day") ? (cell => { const v = cell.getValue(); return (v === null || v === undefined || v === "") ? "" : String(v).padStart(2, "0"); }) : undefined}))});
</script>
{% endblock %}

rules:
- id: skip_zero_block
  name: Skip flights with 0:00 block time (not operated)
  group: Filters
  transform: zero_block
  inputs:
    time: block_time
  outputs: {}
  params: {}
  default: true
- id: skip_not_flying
  name: Skip flights where I am not at the controls (deadhead, training…)
  group: Filters
  transform: not_flying
  inputs:
    crew: crew_list
    deadhead: deadhead
  outputs: {}
  params: {}
  default: true
- id: date_from_parts
  name: Date from year / month / day
  group: Date
  transform: date_parts
  inputs:
    year: year
    month: month
    day: day
  outputs:
    target: date
  params: {}
  default: true
- id: date_from_departure
  name: Date from local departure (if year/month/day are empty)
  group: Date
  transform: datetime_date
  inputs:
    source: departure_local
  outputs:
    target: date
  params: {}
  default: true
- id: aircraft_type_normalize
  name: Normalized aircraft type (CRJ9 → CRJ…) → aircraft_type
  group: Aircraft
  transform: aircraft_type
  inputs:
    source: type
  outputs:
    target: aircraft_type
  params: {}
  default: true
- id: registration_format
  name: Formatted registration (C-FABC) → registration
  group: Aircraft
  transform: registration
  inputs:
    source: registration
  outputs:
    target: registration
  params: {}
  default: true
- id: copy_pilot_in_command
  name: Copy pilot_in_command → pilot_in_command
  group: Crew
  transform: copy
  inputs:
    source: pilot_in_command
  outputs:
    target: pilot_in_command
  params: {}
  default: true
- id: copy_copilot
  name: Copy copilot → copilot
  group: Crew
  transform: copy
  inputs:
    source: copilot
  outputs:
    target: copilot
  params: {}
  default: true
- id: crew_from_list
  name: Crew from crew_list → pilot_in_command, copilot
  group: Crew
  transform: crew
  inputs:
    crew: crew_list
  outputs:
    captain: pilot_in_command
    copilot: copilot
  params: {}
  default: true
- id: departure_icao
  name: Departure as ICAO → departure
  group: Route
  transform: icao_code
  inputs:
    source: departure
  outputs:
    target: departure
  params: {}
  default: true
- id: arrival_icao
  name: Arrival as ICAO → arrival
  group: Route
  transform: icao_code
  inputs:
    source: arrival
  outputs:
    target: arrival
  params: {}
  default: true
- id: copy_remarks
  name: Copy remarks → remarks
  group: Remarks
  transform: copy
  inputs:
    source: remarks
  outputs:
    target: remarks
  params: {}
  default: true
- id: remarks_flight_number
  name: 'Remarks: prefix + flight_number → remarks'
  group: Remarks
  transform: flight_remarks
  inputs:
    source: flight_number
  outputs:
    target: remarks
  params: {}
  default: true
- id: copy_single_engine_dual_day

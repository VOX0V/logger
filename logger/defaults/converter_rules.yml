- id: daynight_single_pic
  name: Block time day/night — single-engine PIC
  group: Day / night
  transform: day_night
  inputs:
    time: block_time
    utc_ms: on_block_millis_utc
    airport: arrival
    registration: registration
  outputs:
    day: single_engine_pic_day
    night: single_engine_pic_night
  params:
    engine: single
    rounding: tc
  default: false
- id: daynight_multi_pic
  name: Block time day/night — multi-engine PIC
  group: Day / night
  transform: day_night
  inputs:
    time: block_time
    utc_ms: on_block_millis_utc
    airport: arrival
    registration: registration
  outputs:
    day: multi_engine_pic_day
    night: multi_engine_pic_night
  params:
    engine: multi
    rounding: tc
  default: false
- id: ifr_block_time
  name: Block time → ifr
  group: Instruments
  transform: tc_round
  inputs:
    time: block_time
  outputs:
    target: ifr
  params:
    rounding: tc
  default: true
- id: daynight_multi_copi
  name: Block time day/night — multi-engine copilot
  group: Day / night
  transform: day_night
  inputs: &id001
    time: block_time
    utc_ms: arrival_millis_utc
    airport: arrival
  outputs:
    day: multi_engine_copi_day
    night: multi_engine_copi_night
  params:
    engine: any
    rounding: tc
  default: true
- id: daynight_xc_pic
  name: Block time day/night — cross-country PIC

rules:
- id: date_from_parts
  name: Date à partir de année / mois / jour
  group: Date
  transform: date_parts
  inputs:
    year: year
    month: month
    day: day
  outputs:
    target: date
  params: {}
  default: true
- id: date_from_departure
  name: Date à partir du départ local (si année/mois/jour vides)
  group: Date
  transform: datetime_date
  inputs:
    source: departure_local
  outputs:
    target: date
  params: {}
  default: true

# Work data definition (work_db.yml): the work data table is created from this file.
#
# Every key "<position>_<name>" is one column of the work data (the number gives the order).
# For each column, "rules" are tried in order: the first rule whose "when" is true (a rule without
# "when" always applies) and whose "value" is not empty gives the value of the column.
#
# Expressions ("when" and "value") can use:
#   - the columns of the raw data by their entity name (date_year, aircraft_type, location_departure_code, time_se_pic_day, ...) and pilot_name
#   - w_<column>: the value already computed for a work column with a lower number (w_leg_time, ...)
#   - numbers, "text", true / false, and / or / not, comparisons (== != < <= > >=), + - * /
#   - dates:    year_of(x), month_of(x), day_of(x)   (x = 2026-09-27, 27/09/2026 or 27/10/23; two digits: 00-69 = 2000s, 70-99 = 1900s)
#               also "Sep 11 2026" and "11 September 2026"; date_of(x) = YYYY-MM-DD of any of these formats
#   - times:    time_of(x) = HH:MM of a datetime, minutes_between(a, b) (datetimes or epoch milliseconds),
#               hhmm(minutes), minutes("HH:MM"), is_zero_time(x)
#               time_24h(x) = HH:MM (24 h) of "5:10AM", "5:10 PM" or "17:10"
#   - numbers:  round(x, digits), distance_nm(lat1, lon1, lat2, lon2) (great circle, nautical miles)
#   - flight time: tc_hours(x) = decimal hours; H:MM is converted with the Transport Canada table (1:35 -> 1.6), a number is kept
#   - sun:      utc_datetime(year, month, day, time_utc, earlier_time) = YYYY-MM-DDTHH:MM (next day if time_utc < earlier_time),
#               sun_angle(lat, lon, datetime_utc) = angle of the sun above the horizon in degrees (0 = horizon, -6 = end of civil twilight)
#   - people:   is_pilot_format(x), pilot_format(x) (-> P.Name), crew_captain(crew_list), crew_copilot(crew_list, pilot_name)
#   - tables:   aircraft(type, field)  fields: display, designator, maker, model, category, engines, engine_type, crew, mtow_lb, mtow_kg
#               location(code, field)   fields: display, icao, iata, company, name, country, latitude, longitude
#               a column added on the Aircraft / Locations structure page is read with its entity name without the group (timezone for location_timezone)
#   - other:    is_blank(x), has_word(text, word), registration_format(x) (CGABC -> C-GABC),
#               strip_chars(text, chars): strip_chars("# 0767", "# ") -> 0767
# "type" is one of: integer, decimal, boolean, date, datetime, text (default: text).
#
# Raw column names are the entities of Data > Entities (crew_pilot_name, crew_copilot_name, crew_operator, location_departure_code,
# location_arrival_code, location_departure_time_utc, location_arrival_time_utc, time_flight_hhmm, time_se_*, time_me_*, time_cc_*,
# time_ifr, time_hood, time_ftd, count_ifr_approach, count_landing_day, ...). A raw column exists only when an import profile has created it.

# Raw rows matching one of these rules are left out of the work data.
skip_rows:
  - name: Flights with a 0:00 block time (not operated)
    when: is_zero_time(time_flight_hhmm)
  - name: Flights where I am not in the crew list
    when: not is_blank(crew_list) and not has_word(crew_list, pilot_name)

############### DATE ###############
# date (YYYY-MM-DD) is built from the raw year, month and day.
1_date:
  type: date
  rules:
    - value: utc_datetime(date_year, date_month, date_day, "00:00", "")

2_year:
  type: integer
  rules:
    - value: date_year
    - value: year_of(date_date)
    - value: year_of(location_departure_time_utc)

3_month:
  type: integer
  rules:
    - value: date_month
    - value: month_of(date_date)
    - value: month_of(location_departure_time_utc)

4_day:
  type: integer
  rules:
    - value: date_day
    - value: day_of(date_date)
    - value: day_of(location_departure_time_utc)

############### AIRCRAFT ###############
5_aircraft_type:
  type: text
  rules:
    - value: aircraft(aircraft_type, "display")
    - value: aircraft_type

6_category:
  type: text
  rules:
    - value: aircraft(aircraft_type, "category")

7_registration:
  type: text
  rules:
    - value: registration_format(aircraft_registration)

8_engines:
  type: text
  rules:
    - value: aircraft(aircraft_type, "engines")

9_crew:
  type: text
  rules:
    - value: aircraft(aircraft_type, "crew")

############### CREW ###############
10_pilot:
  type: text
  rules:
    - when: is_pilot_format(crew_pilot_name)
      value: crew_pilot_name
    - value: pilot_format(crew_pilot_name)
    - value: crew_captain(crew_list)

11_copilot:
  type: text
  rules:
    - when: is_pilot_format(crew_copilot_name)
      value: crew_copilot_name
    - value: pilot_format(crew_copilot_name)
    - value: crew_copilot(crew_list, pilot_name)

12_employer:
  type: text
  rules:
    - value: crew_operator

############### LOCATIONS ###############
13_departure_code:
  type: text
  rules:
    - value: location(location_departure_code, "display")
    - value: location_departure_code

14_departure_name:
  type: text
  rules:
    - value: location(location_departure_code, "name")

15_departure_latitude:
  type: decimal
  rules:
    - value: location(location_departure_code, "latitude")

16_departure_longitude:
  type: decimal
  rules:
    - value: location(location_departure_code, "longitude")

17_departure_time_utc:
  type: text
  rules:
    - value: time_of(location_departure_time_utc)

18_arrival_code:
  type: text
  rules:
    - value: location(location_arrival_code, "display")
    - value: location_arrival_code

19_arrival_name:
  type: text
  rules:
    - value: location(location_arrival_code, "name")

20_arrival_latitude:
  type: decimal
  rules:
    - value: location(location_arrival_code, "latitude")

21_arrival_longitude:
  type: decimal
  rules:
    - value: location(location_arrival_code, "longitude")

22_arrival_time_utc:
  type: text
  rules:
    - value: time_of(location_arrival_time_utc)

23_leg_time:
  type: text
  rules:
    - value: hhmm(minutes_between(location_departure_time_utc, location_arrival_time_utc))
    - when: not is_blank(location_departure_time_utc) and not is_blank(location_arrival_time_utc) and minutes(location_arrival_time_utc) >= minutes(location_departure_time_utc)
      value: hhmm(minutes(location_arrival_time_utc) - minutes(location_departure_time_utc))
    - when: not is_blank(location_departure_time_utc) and not is_blank(location_arrival_time_utc) and minutes(location_arrival_time_utc) < minutes(location_departure_time_utc)
      value: hhmm(minutes(location_arrival_time_utc) - minutes(location_departure_time_utc) + 1440)

24_leg_length:
  type: decimal
  rules:
    - value: round(distance_nm(w_departure_latitude, w_departure_longitude, w_arrival_latitude, w_arrival_longitude), 1)

25_average_speed:
  type: decimal
  rules:
    - value: round(w_leg_length / (minutes(w_leg_time) / 60), 0)

############### SUN AND DAY / NIGHT ###############
26_departure_sun:
  type: decimal
  rules:
    - value: round(sun_angle(w_departure_latitude, w_departure_longitude, utc_datetime(w_year, w_month, w_day, w_departure_time_utc, "")), 1)

27_departure_day_night:
  type: text
  rules:
    - when: not is_blank(w_departure_sun) and w_departure_sun > -6
      value: '"day"'
    - when: not is_blank(w_departure_sun)
      value: '"night"'

28_arrival_sun:
  type: decimal
  rules:
    - value: round(sun_angle(w_arrival_latitude, w_arrival_longitude, utc_datetime(w_year, w_month, w_day, w_arrival_time_utc, w_departure_time_utc)), 1)

29_arrival_day_night:
  type: text
  rules:
    - when: not is_blank(w_arrival_sun) and w_arrival_sun > -6
      value: '"day"'
    - when: not is_blank(w_arrival_sun)
      value: '"night"'

############### REMARKS ###############
31_remarks:
  type: text
  rules:
    - value: misc_remarks

############### FLIGHT TIME ###############
# Decimal hours (Transport Canada table). Only one of these raw columns is filled for a flight, so the order does not matter.
32_flight_time:
  type: decimal
  rules:
    - value: tc_hours(time_se_dual_day)
    - value: tc_hours(time_se_pic_day)
    - value: tc_hours(time_se_dual_night)
    - value: tc_hours(time_se_pic_night)
    - value: tc_hours(time_me_dual_day)
    - value: tc_hours(time_me_pic_day)
    - value: tc_hours(time_me_copi_day)
    - value: tc_hours(time_me_dual_night)
    - value: tc_hours(time_me_pic_night)
    - value: tc_hours(time_me_copi_night)
    - value: tc_hours(time_flight_hhmm)

# Each column first takes its own raw value (se_*, me_*). Only when a flight has none of these raw values (airline
# files without role columns), the flight time is copied into every column of the right category (single or multi engine,
# day or night of the arrival), whatever the role (dual, pic, copi), so that errors show in the totals.
# Next step: keep only the column that matches the role.

33_single_engine_dual_day:
  type: decimal
  rules:
    - value: tc_hours(time_se_dual_day)
    - when: is_blank(time_se_dual_day) and is_blank(time_se_pic_day) and is_blank(time_se_dual_night) and is_blank(time_se_pic_night) and is_blank(time_me_dual_day) and is_blank(time_me_pic_day) and is_blank(time_me_copi_day) and is_blank(time_me_dual_night) and is_blank(time_me_pic_night) and is_blank(time_me_copi_night) and w_engines == "single" and w_arrival_day_night == "day"
      value: w_flight_time

34_single_engine_pic_day:
  type: decimal
  rules:
    - value: tc_hours(time_se_pic_day)
    - when: is_blank(time_se_dual_day) and is_blank(time_se_pic_day) and is_blank(time_se_dual_night) and is_blank(time_se_pic_night) and is_blank(time_me_dual_day) and is_blank(time_me_pic_day) and is_blank(time_me_copi_day) and is_blank(time_me_dual_night) and is_blank(time_me_pic_night) and is_blank(time_me_copi_night) and w_engines == "single" and w_arrival_day_night == "day"
      value: w_flight_time

35_single_engine_dual_night:
  type: decimal
  rules:
    - value: tc_hours(time_se_dual_night)
    - when: is_blank(time_se_dual_day) and is_blank(time_se_pic_day) and is_blank(time_se_dual_night) and is_blank(time_se_pic_night) and is_blank(time_me_dual_day) and is_blank(time_me_pic_day) and is_blank(time_me_copi_day) and is_blank(time_me_dual_night) and is_blank(time_me_pic_night) and is_blank(time_me_copi_night) and w_engines == "single" and w_arrival_day_night == "night"
      value: w_flight_time

36_single_engine_pic_night:
  type: decimal
  rules:
    - value: tc_hours(time_se_pic_night)
    - when: is_blank(time_se_dual_day) and is_blank(time_se_pic_day) and is_blank(time_se_dual_night) and is_blank(time_se_pic_night) and is_blank(time_me_dual_day) and is_blank(time_me_pic_day) and is_blank(time_me_copi_day) and is_blank(time_me_dual_night) and is_blank(time_me_pic_night) and is_blank(time_me_copi_night) and w_engines == "single" and w_arrival_day_night == "night"
      value: w_flight_time

37_multi_engine_dual_day:
  type: decimal
  rules:
    - value: tc_hours(time_me_dual_day)
    - when: is_blank(time_se_dual_day) and is_blank(time_se_pic_day) and is_blank(time_se_dual_night) and is_blank(time_se_pic_night) and is_blank(time_me_dual_day) and is_blank(time_me_pic_day) and is_blank(time_me_copi_day) and is_blank(time_me_dual_night) and is_blank(time_me_pic_night) and is_blank(time_me_copi_night) and w_engines == "multi" and w_arrival_day_night == "day"
      value: w_flight_time

38_multi_engine_pic_day:
  type: decimal
  rules:
    - value: tc_hours(time_me_pic_day)
    - when: is_blank(time_se_dual_day) and is_blank(time_se_pic_day) and is_blank(time_se_dual_night) and is_blank(time_se_pic_night) and is_blank(time_me_dual_day) and is_blank(time_me_pic_day) and is_blank(time_me_copi_day) and is_blank(time_me_dual_night) and is_blank(time_me_pic_night) and is_blank(time_me_copi_night) and w_engines == "multi" and w_arrival_day_night == "day"
      value: w_flight_time

39_multi_engine_copi_day:
  type: decimal
  rules:
    - value: tc_hours(time_me_copi_day)
    - when: is_blank(time_se_dual_day) and is_blank(time_se_pic_day) and is_blank(time_se_dual_night) and is_blank(time_se_pic_night) and is_blank(time_me_dual_day) and is_blank(time_me_pic_day) and is_blank(time_me_copi_day) and is_blank(time_me_dual_night) and is_blank(time_me_pic_night) and is_blank(time_me_copi_night) and w_engines == "multi" and w_arrival_day_night == "day"
      value: w_flight_time

40_multi_engine_dual_night:
  type: decimal
  rules:
    - value: tc_hours(time_me_dual_night)
    - when: is_blank(time_se_dual_day) and is_blank(time_se_pic_day) and is_blank(time_se_dual_night) and is_blank(time_se_pic_night) and is_blank(time_me_dual_day) and is_blank(time_me_pic_day) and is_blank(time_me_copi_day) and is_blank(time_me_dual_night) and is_blank(time_me_pic_night) and is_blank(time_me_copi_night) and w_engines == "multi" and w_arrival_day_night == "night"
      value: w_flight_time

41_multi_engine_pic_night:
  type: decimal
  rules:
    - value: tc_hours(time_me_pic_night)
    - when: is_blank(time_se_dual_day) and is_blank(time_se_pic_day) and is_blank(time_se_dual_night) and is_blank(time_se_pic_night) and is_blank(time_me_dual_day) and is_blank(time_me_pic_day) and is_blank(time_me_copi_day) and is_blank(time_me_dual_night) and is_blank(time_me_pic_night) and is_blank(time_me_copi_night) and w_engines == "multi" and w_arrival_day_night == "night"
      value: w_flight_time

42_multi_engine_copi_night:
  type: decimal
  rules:
    - value: tc_hours(time_me_copi_night)
    - when: is_blank(time_se_dual_day) and is_blank(time_se_pic_day) and is_blank(time_se_dual_night) and is_blank(time_se_pic_night) and is_blank(time_me_dual_day) and is_blank(time_me_pic_day) and is_blank(time_me_copi_day) and is_blank(time_me_dual_night) and is_blank(time_me_pic_night) and is_blank(time_me_copi_night) and w_engines == "multi" and w_arrival_day_night == "night"
      value: w_flight_time

############### FLIGHT DETAILS ###############
# Instruments: the raw value when there is one; an IFR time equal to the flight time for a multi engine multi crew aircraft.
43_ifr:
  type: decimal
  rules:
    - value: tc_hours(time_ifr)
    - when: w_engines == "multi" and w_crew == "multi"
      value: w_flight_time

44_hood:
  type: decimal
  rules:
    - value: tc_hours(time_hood)

45_ftd:
  type: decimal
  rules:
    - value: tc_hours(time_ftd)

46_ifr_approach:
  type: integer
  rules:
    - value: count_ifr_approach

# Cross-country: same rule as the IFR; the flight time goes to the day or night column of the arrival,
# dual and pic both receive it for now (first pass, like the engine columns above).

47_cross_country_dual_day:
  type: decimal
  rules:
    - value: tc_hours(time_cc_dual_day)
    - when: w_engines == "multi" and w_crew == "multi" and w_arrival_day_night == "day"
      value: w_flight_time

48_cross_country_pic_day:
  type: decimal
  rules:
    - value: tc_hours(time_cc_pic_day)
    - when: w_engines == "multi" and w_crew == "multi" and w_arrival_day_night == "day"
      value: w_flight_time

49_cross_country_dual_night:
  type: decimal
  rules:
    - value: tc_hours(time_cc_dual_night)
    - when: w_engines == "multi" and w_crew == "multi" and w_arrival_day_night == "night"
      value: w_flight_time

50_cross_country_pic_night:
  type: decimal
  rules:
    - value: tc_hours(time_cc_pic_night)
    - when: w_engines == "multi" and w_crew == "multi" and w_arrival_day_night == "night"
      value: w_flight_time

# Takeoffs and landings, instruction
51_landings_day:
  type: integer
  rules:
    - value: count_landing_day

52_landings_night:
  type: integer
  rules:
    - value: count_landing_night

53_instruction_day:
  type: decimal
  rules:
    - value: tc_hours(time_instruction_day)

54_instruction_night:
  type: decimal
  rules:
    - value: tc_hours(time_instruction_night)

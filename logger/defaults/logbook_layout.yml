title: Logbook
rows_per_page: 30
row_height_u: 22
# Unit u: 1 u = 0.01 in (Letter landscape 11 x 8.5 in = 1100 x 850 u). Column widths = “width” field of each column (in u), identical on the web page and the PDF.
# row_height_u: thickness of ALL rows (web and PDF); 37 rows x 22 u = 814 u on the PDF.
pdf:
  page_width_u: 1100
  page_height_u: 850
  offset_top_u: 0         # offset of the table from the top (0: the printer handles the margins)
  blank_first_page: true  # blank page 1 so that pages 2 and 3 face each other
  # Gutters (PDF only, for punching the pages): each sheet must total page_width_u.
  # left sheet = columns A to N + gutter_left_u; right sheet = gutter_right_u + columns O to AF.
  gutter_left_u: 29
  gutter_right_u: 38
# On the web page: no gutters, only the two “spacer” columns (width in u) between the left and right tables.
styles:
  font_family: Arial
  font_size: 10
  header_font_size: 9
  border: '1px solid #000000'
  header_background: '#ffffff'
  total_background: '#eeeeee'
  text_align: center
  vertical_align: middle
  alternate_white: true
  data_blocks:
  - name: block1
    rows: 10
    color: '#f1dddd'
  - name: block2
    rows: 10
    color: '#dce7f2'
  - name: block3
    rows: 10
    color: '#eaf1dc'

# Settings of the “Flight time breakdown” report (same system as logbook_layout.yml).
# Unit u: 1 u = 0.01 in. US Legal landscape 14 x 8.5 in = 1400 x 850 u.
# The sum of the column widths must equal page_width_u - 2 x margin_u (here 1360 u), and so must top_widths_u.
# Les couleurs des lignes viennent des blocs de couleurs du logbook (styles.data_blocks de la mise en page du logbook).
title: Flight time breakdown
page_width_u: 1400
page_height_u: 850
margin_u: 20
gap_u: 8
row_height_u: 18
title_height_u: 55
title_font_size: 30
rac_bar_height_u: 16
top_height_u: 235
cert_height_u: 90
qual_row_height_u: 14
photo_height_u: 150
totals_height_u: 55
top_widths_u:
  left: 330
  middle: 700
  right: 330
styles:
  font_family: Arial
  font_size: 9
  header_font_size: 9
  border: '1px solid #000000'
  header_background: '#eeeeee'
  total_background: '#eeeeee'
  text_align: center
  vertical_align: middle
  zero_color: '#cccccc'
